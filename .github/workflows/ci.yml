# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag. A tag can be moved to point
      # at new code; a commit can't.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: builds strictly from the lockfile and fails if
      # package.json and the lockfile disagree. --ignore-scripts keeps any
      # dependency from executing code during install.
      - run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Catches a dependency drifting off its pin.
      - name: Check the lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
